<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Produtos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ee4d2d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .search-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .search-box button {
      background: #ee4d2d;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 22px;
      font-size: 16px;
      cursor: pointer;
    }

    .search-box button:hover {
      background: #d63d20;
    }

    .titulo {
      margin-bottom: 15px;
      font-size: 21px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .produto {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .produto img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #eee;
    }

    .produto-info {
      padding: 15px;
    }

    .produto h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .preco {
      color: #ee4d2d;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .vendas {
      color: #666;
      font-size: 14px;
    }

    .ranking {
      display: inline-block;
      background: #ee4d2d;
      color: white;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .mensagem {
      text-align: center;
      padding: 30px;
      color: #777;
      background: white;
      border-radius: 12px;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      .search-box button {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🛒 Shopee Produtos</h1>
    <p>Pesquisa e ranking de produtos</p>
  </header>

  <div class="container">

    <div class="search-box">
      <input
        type="text"
        id="pesquisa"
        placeholder="Digite o produto que deseja pesquisar..."
      >

      <button onclick="pesquisar()">
        Pesquisar
      </button>
    </div>

    <h2 class="titulo">🔥 Produtos encontrados</h2>

    <div id="produtos" class="produtos">

      <div class="mensagem">
        Digite um produto acima para começar a pesquisa.
      </div>

    </div>

  </div>

  <script>

    function pesquisar() {

      const pesquisa =
        document.getElementById("pesquisa").value.trim();

      const area =
        document.getElementById("produtos");

      if (!pesquisa) {
        area.innerHTML = `
          <div class="mensagem">
            Digite o nome de um produto.
          </div>
        `;
        return;
      }

      area.innerHTML = `
        <div class="mensagem">
          🔎 Pesquisando por:
          <strong>${pesquisa}</strong>
          <br><br>
          A conexão com a fonte de produtos será adicionada
          na próxima etapa.
        </div>
      `;
    }

  </script>

</body>
</html>
